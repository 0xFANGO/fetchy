<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light" />
		<title>Fetchy 收藏库</title>
		<link rel="stylesheet" href="archive.css" />
		<script type="module" src="archive.mjs"></script>
	</head>
	<body>
		<header>
			<div class="bar">
				<a class="brand" href="archive.html"
					><img src="icons/icon48.png" width="32" height="32" alt="" />Fetchy</a
				>
				<nav aria-label="收藏库导航">
					<button type="button" data-view="capture" aria-current="page">当前页面</button
					><button type="button" data-view="library">离线收藏</button
					><button type="button" data-view="tasks">任务</button>
				</nav>
			</div>
		</header>
		<main>
			<section id="view-capture">
				<div class="heading">
					<h1>归档当前页面</h1>
					<button id="reload-source" type="button">重新读取</button>
				</div>
				<div id="capture-context"></div>
				<div id="folder-picker"></div>
				<div id="capture-items"></div>
				<div id="save-bar" class="controls" hidden>
					<button id="save" type="button" class="primary">保存到收藏库</button
					><span id="selection-count"></span>
				</div>
			</section>
			<section id="view-library" hidden>
				<div class="heading"><h1>离线收藏</h1></div>
				<form id="search-form">
					<label>搜索内容<input name="query" type="search" placeholder="标题、作者或正文" /></label
					><label>平台<input name="platform" placeholder="例如 x" /></label
					><label>收藏夹<input name="folder" /></label><label>主题<input name="topic" /></label
					><button type="submit">搜索</button>
				</form>
				<div id="results" class="entries"></div>
			</section>
			<section id="view-tasks" hidden>
				<div class="heading">
					<h1>归档任务</h1>
					<button id="refresh-tasks" type="button">刷新</button>
				</div>
				<div id="task-detail"></div>
				<div id="tasks" class="entries"></div>
			</section>
			<p id="message" role="status" aria-live="polite"></p>
		</main>
	</body>
</html>
