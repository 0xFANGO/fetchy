name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build and zip the extension
        run: npm run extension:pack
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Attach the zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fetchy-extension-*.zip
